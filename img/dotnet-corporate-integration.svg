<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" fill="#181818" rx="8"/>
  
  <!-- Central .NET Node -->
  <rect x="250" y="125" width="100" height="50" fill="#512BD4" rx="5" />
  <text x="300" y="157" font-family="Segoe UI, Arial" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">.NET</text>
  
  <!-- Infrastructure Nodes -->
  <g font-family="Segoe UI, Arial" font-size="12" fill="#E0E0E0" text-anchor="middle">
    <!-- Active Directory -->
    <rect x="50" y="50" width="140" height="40" fill="#121212" stroke="#0078D4" rx="5" />
    <text x="120" y="75">Active Directory</text>
    <line x1="190" y1="70" x2="250" y2="135" stroke="#0078D4" stroke-width="1" opacity="0.5" />
    
    <!-- SQL Server -->
    <rect x="410" y="50" width="140" height="40" fill="#121212" stroke="#512BD4" rx="5" />
    <text x="480" y="75">SQL Server</text>
    <line x1="410" y1="70" x2="350" y2="135" stroke="#512BD4" stroke-width="1" opacity="0.5" />
    
    <!-- Windows/Linux Server -->
    <rect x="50" y="210" width="140" height="40" fill="#121212" stroke="#0078D4" rx="5" />
    <text x="120" y="235">Windows/Linux Server</text>
    <line x1="190" y1="230" x2="250" y2="165" stroke="#0078D4" stroke-width="1" opacity="0.5" />
    
    <!-- Corporate Policies -->
    <rect x="410" y="210" width="140" height="40" fill="#121212" stroke="#512BD4" rx="5" />
    <text x="480" y="235">Políticas de Segurança</text>
    <line x1="410" y1="230" x2="350" y2="165" stroke="#512BD4" stroke-width="1" opacity="0.5" />
  </g>
  
  <text x="300" y="280" font-family="Segoe UI, Arial" font-size="16" fill="#E0E0E0" text-anchor="middle" font-style="italic">Aderência à Infraestrutura Existente</text>
</svg>
